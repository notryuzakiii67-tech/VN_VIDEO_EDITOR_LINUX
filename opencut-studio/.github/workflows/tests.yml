name: tests

on:
  push:
    paths:
      - "opencut-studio/**"
      - "vn_editor/**"
  pull_request:
    paths:
      - "opencut-studio/**"
      - "vn_editor/**"

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: opencut-studio
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libegl1 libgl1 libxkbcommon0 \
            libdbus-1-3 libfontconfig1 libglib2.0-0 libasound2t64

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests (headless Qt)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest

      - name: Self-test smoke
        env:
          QT_QPA_PLATFORM: offscreen
        run: python main.py --self-test
